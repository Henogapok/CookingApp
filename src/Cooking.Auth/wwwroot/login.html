<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — Cooking</title>
  <style>
    :root {
      --bg: #f6f4ef; --card: #ffffff; --text: #1f1d1a; --muted: #6b665e; --accent: #2aabee; --accent-text: #ffffff;
      --border: #e4e0d8; --error: #b3261e;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #171614; --card: #22201d; --text: #f1eee8; --muted: #a39d93; --border: #3a3631; --error: #f2b8b5; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 28px 24px; }
    h1 { margin: 0 0 4px; font-size: 24px; }
    p { margin: 0 0 16px; color: var(--muted); }
    .button {
      display: block; width: 100%; padding: 12px 16px; border: 0; border-radius: 10px; cursor: pointer; text-align: center;
      background: var(--accent); color: var(--accent-text); font: inherit; font-weight: 600; text-decoration: none;
    }
    .button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); margin-top: 8px; }
    .status { margin-top: 16px; color: var(--muted); }
    .status.error { color: var(--error); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <h1>🍳 Cooking</h1>

  <section id="session" hidden>
    <p>Вы вошли как <strong id="session-name"></strong>.</p>
    <a id="continue" class="button" hidden>Продолжить</a>
    <a class="button secondary" href="/connect/logout">Выйти</a>
  </section>

  <section id="login" hidden>
    <p>Войдите через Telegram — бот попросит подтвердить вход.</p>
    <button id="start" class="button" type="button">Войти через Telegram-бота</button>
    <a id="open-bot" class="button" target="_blank" rel="noopener" hidden>Открыть бота</a>
    <button id="restart" class="button secondary" type="button" hidden>Начать заново</button>
    <div id="status" class="status" role="status" aria-live="polite"></div>
  </section>
</main>

<script>
  const returnUrl = new URLSearchParams(location.search).get("returnUrl") || "";
  const $ = id => document.getElementById(id);
  let pollTimer = null;

  function setStatus(text, isError = false) {
    $("status").textContent = text;
    $("status").classList.toggle("error", isError);
  }

  function resetLogin() {
    clearTimeout(pollTimer);
    $("start").hidden = false;
    $("open-bot").hidden = true;
    $("restart").hidden = true;
  }

  async function startLogin() {
    $("start").disabled = true;
    setStatus("");
    try {
      const response = await fetch("/login/bot", { method: "POST" });
      if (!response.ok) throw new Error((await response.json().catch(() => null))?.detail || "Не удалось начать вход.");
      const { link } = await response.json();

      $("start").hidden = true;
      $("open-bot").href = link;
      $("open-bot").hidden = false;
      $("restart").hidden = false;
      setStatus("Откройте бота и нажмите «Войти». Ждём подтверждения…");
      window.open(link, "_blank", "noopener");
      poll();
    } catch (error) {
      setStatus(error.message, true);
    } finally {
      $("start").disabled = false;
    }
  }

  async function poll() {
    try {
      const response = await fetch("/login/bot/poll", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ returnUrl }),
      });
      const result = response.ok ? await response.json() : { status: "error" };

      switch (result.status) {
        case "pending":
          pollTimer = setTimeout(poll, 2000);
          return;
        case "confirmed":
          setStatus("Готово, входим…");
          location.assign(result.redirect);
          return;
        case "declined":
          resetLogin();
          setStatus("Вход отменён в боте.", true);
          return;
        case "expired":
          resetLogin();
          setStatus("Время на подтверждение вышло. Попробуйте ещё раз.", true);
          return;
        default:
          pollTimer = setTimeout(poll, 5000);
      }
    } catch {
      pollTimer = setTimeout(poll, 5000);
    }
  }

  async function init() {
    const response = await fetch("/login/session").catch(() => null);
    if (response?.ok) {
      const { name } = await response.json();
      $("session-name").textContent = name;
      if (returnUrl.startsWith("/") && !returnUrl.startsWith("//")) {
        $("continue").href = returnUrl;
        $("continue").hidden = false;
      }
      $("session").hidden = false;
      return;
    }
    $("login").hidden = false;
  }

  $("start").addEventListener("click", startLogin);
  $("restart").addEventListener("click", () => { resetLogin(); setStatus(""); });
  init();
</script>
</body>
</html>
