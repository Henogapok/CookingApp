services:
  postgres:
    image: postgres:16
    container_name: recipe-db
    environment:
      POSTGRES_USER: recipe_user
      POSTGRES_PASSWORD: recipe_pass
      POSTGRES_DB: recipe_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: recipe-mq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  seq:
    image: datalust/seq:latest
    container_name: recipe-logs
    ports:
      - "5341:80"  # UI + log ingestion
    environment:
      ACCEPT_EULA: "Y"
      # Личный проект на два человека, порт наружу не смотрит — без авторизации в Seq UI.
      SEQ_FIRSTRUN_NOAUTHENTICATION: "True"
    volumes:
      - seq_data:/data

volumes:
  pg_data:
  seq_data: