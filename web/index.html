<!doctype html>
<!-- data-theme — текущая тема (переменные в app/styles/global.css). Пока одна; выбор темы добавим следующим шагом. -->
<html lang="ru" data-theme="sage">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover — страница заходит под вырез и полоску «домой» iPhone, отступы задаём сами через env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Цвет строки состояния и панели браузера — как у шапки. -->
    <meta name="theme-color" content="#2f5d43" />
    <title>Cooking</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
