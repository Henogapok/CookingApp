name: CI

on:
  push:
    # main проверяет workflow деплоя (вызывает этот же CI перед сборкой образа).
    branches: [ dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_call:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Cooking.sln

      - name: Build
        run: dotnet build Cooking.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Cooking.sln --no-build --configuration Release

  # PWA: те же проверки, что локально (CLAUDE.md, «Фронтенд»), — параллельно с .NET.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # npm ci — ставит ровно версии из package-lock.json и падает, если lock не совпадает с package.json.
      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Lint FSD
        run: npm run lint:fsd

      - name: Test
        run: npm test
