name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Cooking.sln

      - name: Build
        run: dotnet build Cooking.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Cooking.sln --no-build --configuration Release
